<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="contact-card container shadow-lg d-flex mt-5 mb-5 p-0 rounded-5 bg-primary w-100 h-100">
        <div class="align-content-center bg-primary border-radius rounded-5 p-4 text-white">
            <div class="text-center mb-4">
                <h1 class="fw-bolder fs-1">Let's Chat</h1>
                <p class="text-center fs-5">Whether you have a question, you want to start a project or siomply want to connect</p> <span class="fs-6">Feel free to send me a message in the contact form</span>
            </div>
        </div>
            <div class="bg-light border border-light shadow-lg border-radius rounded-5 w-75">
                    <h1 class="text-center fw-bolder mt-2">Contact</h1>
                        <form action="" class="contact-right flex-column ms-1">
                             <label for="" class="ms-lg-5 mb-1"><b>Required*</b></label><br>
                                <input type="text" placeholder="Name*" required class="form-control border border-radius rounded-5 m-auto mb-2 p-2 w-75">
                                <input type="text" placeholder="Email*" required class="form-control border border-radius rounded-5 m-auto mb-2 p-2 w-75">
                                <input type="text" placeholder="Company" class="form-control border border-radius rounded-5 m-auto mb-2 p-2 w-75">
                                <input type="text" placeholder="Phone Number" class="form-control border border-radius rounded-5 m-auto mb-2 p-2 w-75">
                                <textarea name="message" id="" cols="30" rows="5" placeholder="Your Message*" required class="form-control border border-radius rounded-5 p-3 m-auto w-75"></textarea>
                                <button class="btn btn-outline-primary m-auto mt-3 mb-4 w-25 border border-radius rounded-5 d-block">Submit</button>
                        </form>
            </div>
    </div>
</body>
</html>
